name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    name: Repeat QGIS publication gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pytest flake8 bandit detect-secrets

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Run Flake8
        run: python -m flake8 tree_counter scripts tests

      - name: Run Bandit
        run: python -m bandit --ini .bandit -r tree_counter scripts

      - name: Run blocking detect-secrets hook
        shell: bash
        run: |
          set -o pipefail
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Validate runtime dependency locks
        run: python scripts/check_runtime_locks.py

      - name: Validate source publication policy
        run: python scripts/check_publication.py

      - name: Build deterministic plugin package
        run: python scripts/package_plugin.py

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import configparser; p=configparser.ConfigParser(interpolation=None); p.read("tree_counter/metadata.txt", encoding="utf-8"); print(p["general"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate packaged archive
        run: python scripts/check_publication.py "dist/tree_counter-${{ steps.version.outputs.version }}.zip"

  qgis4-checker:
    name: PyQGIS 4 compatibility checker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Preview PyQt5 to PyQt6 compatibility changes
        run: pyqt5_to_pyqt6.py --dry_run --logfile pyqgis4-checker.log tree_counter/

      - name: Run blocking PyQt5 to PyQt6 compatibility check
        run: pyqt5_to_pyqt6.py tree_counter/

      - name: Upload checker log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyqgis4-checker-log
          path: pyqgis4-checker.log
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: [quality, qgis4-checker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pytest flake8 bandit detect-secrets

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Run Flake8
        run: python -m flake8 tree_counter scripts tests

      - name: Run Bandit
        run: python -m bandit --ini .bandit -r tree_counter scripts

      - name: Run blocking detect-secrets hook
        shell: bash
        run: |
          set -o pipefail
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      - name: Validate runtime dependency locks
        run: python scripts/check_runtime_locks.py

      - name: Validate source publication policy
        run: python scripts/check_publication.py

      - name: Build deterministic plugin package
        run: python scripts/package_plugin.py

      - name: Determine and validate release version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import configparser; p=configparser.ConfigParser(interpolation=None); p.read("tree_counter/metadata.txt", encoding="utf-8"); print(p["general"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate packaged archive
        run: python scripts/check_publication.py "dist/tree_counter-${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/tree_counter-${{ steps.version.outputs.version }}.zip"
          gh release create "${GITHUB_REF_NAME}" "${archive}" \
            --title "Tree Counter ${GITHUB_REF_NAME}" \
            --generate-notes

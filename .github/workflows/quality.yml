name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    name: QGIS publication gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pytest flake8 bandit detect-secrets

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Run Flake8
        run: python -m flake8 tree_counter scripts tests

      - name: Run Bandit
        run: python -m bandit -r tree_counter scripts

      - name: Run detect-secrets
        run: detect-secrets scan --baseline .secrets.baseline

      - name: Validate source publication policy
        run: python scripts/check_publication.py

      - name: Build deterministic plugin package
        run: python scripts/package_plugin.py

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import configparser; p=configparser.ConfigParser(interpolation=None); p.read("tree_counter/metadata.txt", encoding="utf-8"); print(p["general"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate packaged archive
        run: python scripts/check_publication.py "dist/tree_counter-${{ steps.version.outputs.version }}.zip"

      - name: Upload validated plugin package
        uses: actions/upload-artifact@v4
        with:
          name: tree-counter-plugin
          path: dist/tree_counter-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
